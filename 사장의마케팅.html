ttom:0}.rank-row.current{background:#effaf5}.rank-num{font-weight:950;color:var(--green)}.rank-count{text-align:right;font-weight:900}.restart{display:block;width:100%;margin-top:24px;border:0;border-radius:17px;padding:19px;background:var(--yellow);color:var(--ink);font-size:18px;font-weight:950;cursor:pointer;box-shadow:0 10px 24px rgba(255,212,93,.3)}.restart:hover{transform:translateY(-2px)}.footer{text-align:center;color:#788780;font-size:12px;margin-top:18px}

<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark">M</span><span>사장의 마케팅 게임</span></div><div class="progress-wrap" id="progressWrap" hidden><div class="progress-meta"><span id="stepText">진단 준비</span><span id="percentText">0%</span></div><div class="progress"><i id="progressBar"></i></div></div></header>
    <section class="mini-guide" id="miniGuide"><div class="mini"><b>필수 마케팅</b><span id="mustMini">진단 후 알려드려요</span></div><div class="mini"><b>선택 마케팅</b><span id="optionalMini">진단 후 알려드려요</span></div></section>
    <article class="card" id="card" aria-live="polite"></article>
    <div class="footer">많이 하는 마케팅보다, 나에게 맞는 마케팅부터.</div>
  </main>
  <script>
  (()=>{
    const TYPES={search:{name:'검색해서 찾아오는 사장님',short:'검색발견형',icon:'🔎'},local:{name:'동네를 잡는 사장님',short:'지역공략형',icon:'📍'},info:{name:'알려줘서 파는 사장님',short:'정보신뢰형',icon:'📚'},relation:{name:'계속 연락하는 사장님',short:'관계관리형',icon:'🤝'},visual:{name:'보여줘서 파는 사장님',short:'비주얼콘텐츠형',icon:'📸'},video:{name:'영상으로 설득하는 사장님',short:'영상설득형',icon:'🎥'},direct:{name:'고객을 찾아가는 사장님',short:'직접공략형',icon:'🎯'}};
    const D={};Object.keys(TYPES).forEach(k=>D[k]=0);
    const W=(...x)=>{const o={};for(let i=0;i<x.length;i+=2)o[x[i]]=x[i+1];return o};
    const questions=[
      ['고객은 당신의 사업을 처음 어떻게 알게 되나요?','가장 흔한 첫 만남을 골라주세요.',[['네이버·구글 등에서 검색',W('search',5,'info',1,'local',2)],['지나가다가 발견',W('local',5,'visual',1)],['인스타그램·SNS',W('visual',5,'relation',1)],['지인 소개',W('relation',3,'info',2)],['내가 직접 고객에게 알림',W('direct',5,'relation',2)],['기존 고객에게 다시 알림',W('relation',5,'direct',2)]]],
      ['구매 전에 정보를 얼마나 알아봐야 하나요?','상품·서비스를 이해하는 데 필요한 설명의 양입니다.',[['거의 그렇지 않다',W('visual',2,'local',1)],['조금 알아본다',W('info',2,'search',1)],['꽤 많이 알아본다',W('info',4,'search',2)],['전문적인 설명이 반드시 필요하다',W('info',5,'video',2,'search',2)]]],
      ['고객은 얼마나 자주 다시 구매하거나 방문하나요?','재방문과 반복 구매의 비중을 생각해보세요.',[['거의 한 번만 이용',W('search',2,'direct',1)],['가끔 다시 이용',W('relation',2)],['정기적으로 이용',W('relation',4,'direct',1)],['계속 이용하는 고객이 많다',W('relation',5,'info',1)]]],
      ["사업에서 '거리'가 얼마나 중요한가요?",'고객과 사업장의 물리적 거리를 기준으로 답해주세요.',[['전국 어디서든 고객이 올 수 있다',W('search',2,'info',2)],['어느 지역이든 상관없다',W('info',2,'video',1)],['주변 고객이 중요하다',W('local',4,'search',1)],['대부분 가까운 고객이다',W('local',5,'visual',1)]]],

="section-title">🏆 당신에게 가장 잘 맞는 도구</h2><div class="tool-list">${toolRank.slice(0,4).map((t,i)=>`<div class="tool"><b>${i+1}. ${t.name}</b><p>${t.desc}</p></div>`).join('')}</div><h2 class="section-title">⏸️ 지금 당장 하지 않아도 되는 것</h2><div class="low"><b>${low.map(x=>x.name).join(' · ')}</b><br>효과가 없는 도구라는 뜻은 아닙니다. 현재 사업에서는 위의 필수 마케팅에 시간과 예산을 먼저 모으는 편이 효율적입니다.</div><h2 class="section-title">🏅 누적 엔딩 순위표</h2><div class="ranking">${rankingHTML(savedRecords,top)}</div><h2 class="section-title">🚀 이번 주 첫 번째 마케팅 미션</h2><div class="mission">이번 주에 할 일은 딱 3개입니다.<ul>${missions.map(x=>`<li>☑ ${x}</li>`).join('')}</ul></div>${logoBlock('result-logo')}<button class="restart" id="restart">처음부터 다시하기</button></div>`;saveDiagnosisResult(top,must);document.querySelector('#restart').onclick=()=>{card.classList.remove('result-card');intro();scrollTo({top:0,behavior:'smooth'})};scrollTo({top:0,behavior:'smooth'})}
    function description(k){return{search:'고객이 필요한 순간, 검색을 통해 당신의 사업을 발견하는 구조입니다.',local:'가까운 고객의 발견과 방문을 매출로 연결하는 사업입니다.',info:'정보와 신뢰가 고객의 구매 결정을 만드는 사업입니다.',relation:'한 번 만난 고객과 꾸준히 연결될수록 강해지는 사업입니다.',visual:'말보다 사진과 분위기가 매력을 빠르게 전달하는 사업입니다.',video:'과정과 경험을 생생하게 보여줄 때 설득력이 커지는 사업입니다.',direct:'정확한 고객을 찾아 먼저 제안할 때 성과가 나는 사업입니다.'}[k]}
    function missionFor(k,m){const common={search:['네이버·구글·카카오 지도 정보를 최신화하기','고객이 검색할 질문 5개 적기','그중 하나를 블로그 글로 발행하기'],local:['지도 3곳의 영업시간·사진·소개를 통일하기','대표 메뉴·서비스 사진 5장 올리기','가까운 고객용 한 줄 혜택 만들기'],info:['고객이 자주 묻는 질문 5개 적기','가장 중요한 질문을 700자 글로 쓰기','글 끝에 문의·예약 방법 넣기'],relation:['기존 고객 명단을 한곳에 정리하기','이번 주 소식 한 문장 만들기','부담 없는 재방문 메시지 1회 보내기'],visual:['대표 상품의 전·후 또는 사용 장면 촬영하기','인스타그램 소개 문구를 고객 관점으로 고치기','사진 3장으로 한 게시물 발행하기'],video:['고객 질문 하나를 60초 대본으로 만들기','스마트폰으로 설명 영상 1개 촬영하기','제목과 문의 방법을 넣어 게시하기'],direct:['가장 원하는 고객 한 문장으로 정의하기','연락 가능한 잠재고객 20명 정리하기','혜택보다 문제 해결 중심의 첫 메시지 보내기']}[k];const mapMission='네이버·구글·카카오맵의 영업시간·사진·연락처 최신화하기';return common?[mapMission,...common.filter(x=>!x.includes('지도')).slice(0,2)]:[mapMission,...m.filter(x=>!x.universal).slice(0,2).map(x=>x.name+' 시작하기')]}
    intro();
  })();
  </script>
